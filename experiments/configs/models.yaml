# Model registry — all recommended Ollama models for agenticpathplanner
#
# Use this as a reference when selecting models for each subproject.
# Pull commands: ollama pull <model>
#
# Reference: docs/research_positioning.md §10

# ---------------------------------------------------------------------------
# Generator models — code generation (Idea 2)
# ---------------------------------------------------------------------------

generator:
  primary:
    model: qwen2.5-coder:14b
    vram_gb: 14
    temperature: 0.1
    note: "Best code quality. Requires 24 GB+ VRAM."
  balanced:
    model: qwen2.5-coder:7b
    vram_gb: 7
    temperature: 0.1
    note: "Best size/quality trade-off. Runs on 8 GB VRAM."
  alternative_1:
    model: deepseek-coder-v2:16b
    vram_gb: 16
    temperature: 0.1
    note: "Strong algorithmic reasoning. Good at heapq/numpy usage."
  alternative_2:
    model: codellama:13b
    vram_gb: 8
    temperature: 0.1
    note: "Well-tested and stable. Older but reliable."
  lightweight:
    model: qwen2.5-coder:3b
    vram_gb: 3
    temperature: 0.1
    note: "CPU-friendly. Generates plausible but sometimes incomplete functions."

# ---------------------------------------------------------------------------
# Refiner models — spatial reasoning + instruction following (Idea 1)
# ---------------------------------------------------------------------------

refiner:
  primary:
    model: llama3.1:8b
    vram_gb: 8
    temperature: 0.4
    note: "Strong instruction following and spatial reasoning."
  balanced:
    model: mistral:7b
    vram_gb: 7
    temperature: 0.4
    note: "Lightweight and highly reliable at format compliance."
  alternative_1:
    model: qwen2.5:7b
    vram_gb: 7
    temperature: 0.4
    note: "Good structured output; handles environmental context well."
  lightweight:
    model: phi3.5:3.8b
    vram_gb: 4
    temperature: 0.4
    note: "Strong reasoning for its size. Runs on CPU."

# ---------------------------------------------------------------------------
# Selector models — structured output + algorithmic reasoning (Idea 3)
# ---------------------------------------------------------------------------

selector:
  primary:
    model: llama3.1:8b
    vram_gb: 8
    temperature: 0.1
    note: "Best at Selected:/Reasoning: format. Strong algorithm knowledge."
  balanced:
    model: mistral:7b
    vram_gb: 7
    temperature: 0.1
    note: "Highest format compliance. Lowest hallucination rate on algorithm names."
  alternative_1:
    model: qwen2.5:7b
    vram_gb: 7
    temperature: 0.1
    note: "Good condition reasoning in natural language."
  alternative_2:
    model: phi3:14b
    vram_gb: 14
    temperature: 0.1
    note: "Strong reasoning on algorithm trade-offs."
  lightweight:
    model: phi3.5:3.8b
    vram_gb: 4
    temperature: 0.1
    note: "CPU-friendly. Format compliance inconsistent below 7B."

# ---------------------------------------------------------------------------
# Hardware tiers
# ---------------------------------------------------------------------------

hardware_tiers:
  high:
    vram_gb: 24
    recommended:
      - qwen2.5-coder:14b
      - deepseek-coder-v2:16b
      - phi3:14b
  mid:
    vram_gb: 8
    recommended:
      - qwen2.5-coder:7b
      - llama3.1:8b
      - mistral:7b
      - gemma2:9b
  low:
    vram_gb: 0   # CPU
    recommended:
      - qwen2.5-coder:3b
      - phi3.5:3.8b
      - llama3.2:3b

# ---------------------------------------------------------------------------
# Pull commands (run once to download models)
# ---------------------------------------------------------------------------

# Generator
# ollama pull qwen2.5-coder:14b
# ollama pull qwen2.5-coder:7b
# ollama pull deepseek-coder-v2:16b
# ollama pull codellama:13b
# ollama pull qwen2.5-coder:3b

# Refiner / Selector
# ollama pull llama3.1:8b
# ollama pull mistral:7b
# ollama pull qwen2.5:7b
# ollama pull phi3.5:3.8b
# ollama pull phi3:14b
