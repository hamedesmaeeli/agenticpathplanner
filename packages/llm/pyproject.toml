[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticpathplanner-llm"
version = "0.1.0"
description = "LLM-based path planner (Ollama) for Agentic Path Planner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Faramarz Safiesfahani" }]
dependencies = [
    "agenticpathplanner-core>=0.1.0",
    "ollama>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
