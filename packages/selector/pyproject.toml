[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticpathplanner-selector"
version = "0.1.0"
description = "Idea 3 — LLM selects the best algorithm from a registry based on real-time conditions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Faramarz Safiesfahani" }]
dependencies = [
    "agenticpathplanner-core>=0.1.0",
    "agenticpathplanner-classical>=0.1.0",
    "agenticpathplanner-llm>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
