# Root pyproject.toml — dev tooling only.
# Installable subprojects live under packages/<name>/.
# Run `make install-dev` to install all in editable mode.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticpathplanner-dev"
version = "0.0.0"
description = "Dev meta-package — configures tooling, installs nothing"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 100
src = ["packages/*/src"]

[tool.pytest.ini_options]
# Run per-package:  pytest packages/core/tests/
# Run all:          make test-all
